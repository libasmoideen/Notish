<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notish</title>
<meta name="theme-color" content="#7C3DEA" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7C3DEA; --purple-dark:#5E2BC0; --purple-light:#F1EAFD;
    --ink:#231B33; --sub:#746C88; --bg:#FAF9FC; --card:#FFFFFF; --line:#E9E4F5; --red:#D9455F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,sans-serif;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #app{max-width:520px;margin:0 auto;padding:0 0 90px;min-height:100vh;}

  .topbar{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;position:sticky;top:0;z-index:5;}
  .topbar img{width:34px;height:34px;border-radius:9px;}
  .brandBlock{display:flex;flex-direction:column;line-height:1.1;}
  .topbar .name{font-size:19px;font-weight:800;letter-spacing:.2px;}
  .topbar .tagline{font-size:11px;font-weight:500;opacity:.8;text-transform:lowercase;margin-top:1px;}

  .totalBand{margin:14px 16px 6px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 8px 20px -8px rgba(124,61,234,.55);}
  .totalLabel{font-size:12.5px;opacity:.85;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .totalNumber{font-size:32px;font-variant-numeric:tabular-nums;font-weight:800;}

  .section{margin:16px 16px 0;}
  .sectionTitle{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}

  input, select{padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-family:inherit;min-width:0;width:100%;}
  input:focus, select:focus{outline:none;border-color:var(--purple);}

  .amountRow{display:flex;align-items:center;gap:10px;border:2px solid var(--purple);border-radius:12px;padding:10px 14px;background:var(--purple-light);}
  .amountRow .rupee{font-size:24px;font-weight:800;color:var(--purple);}
  .amountRow input{font-size:24px;font-weight:700;border:none;padding:6px 0;background:transparent;flex:1;}
  .amountHint{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.4px;margin-bottom:6px;}

  .catGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .catBtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;}
  .catBtn .emoji{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .catBtn .lbl{font-size:10.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.15;}
  .catBtn.active{border-color:var(--purple);background:var(--purple-light);}
  .catBtn.active .lbl{color:var(--purple-dark);}

  .noteRow{margin-top:12px;}
  .addBtn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:none;background:var(--purple);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  .removeEarningsBtn{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1.5px solid var(--red);background:#fff;color:var(--red);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}
  .pageTitle{font-size:20px;font-weight:800;color:var(--ink);}
  .laSectionHead{display:flex;justify-content:space-between;align-items:center;}
  .laCard{margin-bottom:12px;}
  .laCardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .laName{font-size:15px;font-weight:800;}
  .settledBadge{display:inline-block;background:#E7F7EE;color:#1F9254;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
  .laAddRow{display:flex;gap:10px;}
  .laAddCol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .laAddCol input[type=date]{font-size:12px;padding:8px;}
  .laHistory{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;}
  .laHistoryRow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;}
  .laHistoryRow:last-child{border-bottom:none;}
  .laHistoryText{flex:1;color:var(--ink);}
  .iconBtn{background:transparent;border:none;color:var(--sub);font-size:14px;cursor:pointer;padding:0 4px;}
  .laMiniBtn{padding:6px 10px;border-radius:8px;border:none;background:var(--purple);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .laMiniBtnGhost{background:#fff;color:var(--sub);border:1.5px solid var(--line);}
  .addBtn:disabled{opacity:.45;}
  .formError{color:var(--red);font-size:12.5px;margin-top:8px;}

  .dateNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .navBtn{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink);font-family:inherit;cursor:pointer;font-weight:600;}
  .navCenter{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .navCenterLabel{font-size:15px;font-weight:700;}
  .jumpDate{font-size:11.5px;border:none;background:transparent;color:var(--purple);font-family:inherit;font-weight:600;text-decoration:underline;padding:2px;}

  .entryRow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .entryRow:last-child{border-bottom:none;}
  .entryIcon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .entryMid{flex:1;min-width:0;}
  .entryCat{font-size:14px;font-weight:700;}
  .entryNote{font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entryAmount{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .deleteBtn{background:transparent;border:none;color:var(--sub);opacity:.55;font-size:19px;line-height:1;padding:0 2px 0 8px;cursor:pointer;}

  .empty{padding:26px 6px;font-size:13.5px;color:var(--sub);text-align:center;}

  .bar-item{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px;}
  .bar-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
  .bar-label{width:64px;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:var(--purple-light);border-radius:4px;height:14px;overflow:hidden;}
  .bar-fill{display:block;height:100%;border-radius:4px;}
  .bar-value{width:100px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px;}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10;max-width:520px;margin:0 auto;}
  .tabbarItem{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;font-family:inherit;color:var(--sub);font-size:10.5px;font-weight:600;cursor:pointer;padding:4px 10px;flex:1;}
  .tabbarItem .ic{font-size:19px;}
  .tabbarItem.active{color:var(--purple);}

  .filterRow{display:flex;flex-direction:column;gap:10px;}
  .filterRange{display:flex;gap:8px;}
  .filterRange > div{flex:1;}
  .filterLbl{font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:4px;}
  .applyBtn{padding:12px;border-radius:10px;border:none;background:var(--purple);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}

  .resultBand{background:var(--purple-light);border-radius:12px;padding:14px 16px;margin-top:14px;}
  .resultLabel{font-size:12px;color:var(--purple-dark);font-weight:600;margin-bottom:2px;}
  .resultNumber{font-size:24px;font-weight:800;color:var(--purple-dark);}

  .errorBanner{background:#FDECEF;color:var(--red);border:1px solid var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin:14px 16px 0;}
  .installBanner{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--purple-light);border:1px solid var(--purple);border-radius:12px;padding:11px 14px;font-size:12.5px;margin:14px 16px 0;color:var(--purple-dark);}
  .installBanner button{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-family:inherit;font-weight:700;cursor:pointer;}
  :focus-visible{outline:2px solid var(--purple);outline-offset:2px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CATEGORIES = [
  { key:"Food", emoji:"🍽️", color:"#E0644B" },
  { key:"Tea & Snacks", emoji:"🍵", color:"#5B8C51" },
  { key:"Fuel", emoji:"⛽", color:"#C97A2E" },
  { key:"Internet", emoji:"🌐", color:"#3B7DBF" },
  { key:"Clothing", emoji:"👕", color:"#7757B5" },
  { key:"Hospital", emoji:"🏥", color:"#D9455F" },
  { key:"Gym", emoji:"🏋️", color:"#2E9E6B" },
  { key:"Groceries", emoji:"🧺", color:"#3F8E5E" },
  { key:"Scooter", emoji:"🛵", color:"#3F8E7A" },
  { key:"Car", emoji:"🚗", color:"#4A5FBF" },
  { key:"Bus fare", emoji:"🚌", color:"#B0762E" },
  { key:"Personal Care", emoji:"🧴", color:"#C97AA8" },
  { key:"Education", emoji:"🎓", color:"#4F6BB0" },
  { key:"EMIs", emoji:"💳", color:"#6B5B3E" },
  { key:"Online Purchase", emoji:"🛒", color:"#E0A63B" },
  { key:"Games & Entertainment", emoji:"🎮", color:"#5B7FBF" },
  { key:"Other", emoji:"📦", color:"#7A7A7A" },
];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STORAGE_KEY = "notish_entries_v1";
const EARNINGS_STORAGE_KEY = "notish_earnings_v1";
const LA_STORAGE_KEY = "notish_la_records_v1";
const BLUE = "#2F6FED";

function catInfo(key){ return CATEGORIES.find(c=>c.key===key) || CATEGORIES[CATEGORIES.length-1]; }
function fmt(n){ return "\u20B9" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function monthLabel(y,m){ return new Date(y,m,1).toLocaleString("en-IN",{month:"long",year:"numeric"}); }
function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadEntries(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveEntries(entries){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); return true; }
  catch(e){ return false; }
}
function loadEarnings(){
  try{ const raw = localStorage.getItem(EARNINGS_STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveEarnings(earnings){
  try{ localStorage.setItem(EARNINGS_STORAGE_KEY, JSON.stringify(earnings)); return true; }
  catch(e){ return false; }
}
function loadLaRecords(){
  try{ const raw = localStorage.getItem(LA_STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLaRecords(list){
  try{ localStorage.setItem(LA_STORAGE_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}

let state = {
  entries: loadEntries(),
  earnings: loadEarnings(),
  laRecords: loadLaRecords(),
  view: "day",
  selectedDate: todayStr(),
  inflowDate: todayStr(),
  knownToday: todayStr(),
  monthCursor: (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
  yearCursor: new Date().getFullYear(),
  inflowMonthCursor: (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
  inflowYearCursorForMonthly: new Date().getFullYear(),
  amount: "",
  category: null,
  note: "",
  formError: "",
  saveError: false,
  filterCategory: "All",
  filterNote: "",
  filterFrom: (()=>{ const d=new Date(); d.setDate(d.getDate()-6); return d.toISOString().slice(0,10); })(),
  filterTo: todayStr(),
  filterApplied: false,
  laNewOpen: { loan:false, advance:false },
  laNewDraft: {
    loan: { name:"", amt2:"", date2: todayStr(), amt3:"", date3: todayStr() },
    advance: { name:"", amt2:"", date2: todayStr(), amt3:"", date3: todayStr() },
  },
  laFormError: { loan:"", advance:"" },
  laEntryDraft: {},
  laEditingEntry: null,
  laEditDraft: { amount:"", date:"" },
};

function persist(next){
  state.entries = next;
  const ok = saveEntries(next);
  state.saveError = !ok;
  render();
}

function addEntry(){
  const amt = parseFloat(state.amount);
  if(!amt || amt<=0){ state.formError = "Enter an amount greater than 0."; render(); return; }
  if(!state.category){ state.formError = "Pick a category for this expense."; render(); return; }
  state.formError = "";
  const entry = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), date: state.selectedDate, category: state.category, amount: amt, note: state.note.trim() };
  const next = [entry, ...state.entries];
  state.amount = ""; state.category = null; state.note = "";
  persist(next);
}
function deleteEntry(id){ persist(state.entries.filter(en=>en.id!==id)); }

function shiftDay(delta){
  const d = new Date(state.selectedDate+"T00:00:00");
  d.setDate(d.getDate()+delta);
  state.selectedDate = d.toISOString().slice(0,10);
  render();
}
function jumpToDate(v){ state.selectedDate = v; render(); }
function shiftInflowDay(delta){
  const d = new Date(state.inflowDate+"T00:00:00");
  d.setDate(d.getDate()+delta);
  state.inflowDate = d.toISOString().slice(0,10);
  render();
}
function jumpInflowDate(v){ state.inflowDate = v; render(); }
function shiftInflowMonthCursor(delta){
  let m = state.inflowMonthCursor.m + delta, y = state.inflowMonthCursor.y;
  if(m<0){ m=11; y-=1; } if(m>11){ m=0; y+=1; }
  state.inflowMonthCursor = {y,m}; render();
}
function shiftInflowYearCursor(delta){ state.inflowYearCursorForMonthly += delta; render(); }
function shiftMonth(delta){
  let m = state.monthCursor.m + delta, y = state.monthCursor.y;
  if(m<0){ m=11; y-=1; } if(m>11){ m=0; y+=1; }
  state.monthCursor = {y,m}; render();
}
function shiftYear(delta){ state.yearCursor += delta; render(); }
function setView(v){ state.view = v; state.formError=""; render(); }
function selectCategory(key){ state.category = key; state.formError=""; render(); }
function updateAmount(v){ state.amount = v; }
function updateNote(v){ state.note = v; }
function getEarningsNum(date){ return parseFloat(state.earnings[date]) || 0; }
function updateEarnings(v){
  state.earnings[state.inflowDate] = v;
  saveEarnings(state.earnings);
}
function removeEarnings(date){
  delete state.earnings[date];
  saveEarnings(state.earnings);
  render();
}
function getOpeningBalance(date){
  const inflowBefore = getEventsTotal(d=>d<date);
  let exp = 0;
  state.entries.forEach(en=>{ if(en.date < date) exp += en.amount; });
  return inflowBefore - exp;
}

// Net inflow (earnings + loan/advance flows) matching the given date predicate.
// Loan received / advance received-back count as +; loan repaid / advance paid count as -.
function getEventsTotal(dateMatches){
  let total = 0;
  Object.keys(state.earnings).forEach(d=>{ if(dateMatches(d)) total += getEarningsNum(d); });
  state.laRecords.forEach(rec=>{
    rec.history.forEach(h=>{
      if(!dateMatches(h.date)) return;
      if(rec.section === "loan"){
        if(h.type === "received") total += h.amount;
        else if(h.type === "repaid") total -= h.amount;
      } else if(rec.section === "advance"){
        if(h.type === "received") total += h.amount;
        else if(h.type === "paid") total -= h.amount;
      }
    });
  });
  return total;
}

function getDailyInflowForMonth(y,m){
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prefix = y + "-" + String(m+1).padStart(2,"0");
  const arr = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = prefix + "-" + String(d).padStart(2,"0");
    const val = getEventsTotal(dt=>dt===dateStr);
    if(val !== 0) arr.push({name:String(d), value: val});
  }
  return arr;
}
function getMonthlyInflowForYear(y){
  const totals = Array(12).fill(0);
  const yStr = String(y);
  Object.keys(state.earnings).forEach(d=>{ if(d.startsWith(yStr)){ const idx=parseInt(d.slice(5,7),10)-1; totals[idx]+=getEarningsNum(d); } });
  state.laRecords.forEach(rec=>{
    rec.history.forEach(h=>{
      if(!h.date.startsWith(yStr)) return;
      const idx = parseInt(h.date.slice(5,7),10)-1;
      if(rec.section === "loan"){
        if(h.type==="received") totals[idx]+=h.amount; else if(h.type==="repaid") totals[idx]-=h.amount;
      } else if(rec.section === "advance"){
        if(h.type==="received") totals[idx]+=h.amount; else if(h.type==="paid") totals[idx]-=h.amount;
      }
    });
  });
  return totals.map((v,i)=>({name:MONTH_SHORT[i], value:Math.round(v)}));
}
function getYearlyInflowTotals(){
  const map = {};
  Object.keys(state.earnings).forEach(d=>{ const y=d.slice(0,4); map[y]=(map[y]||0)+getEarningsNum(d); });
  state.laRecords.forEach(rec=>{
    rec.history.forEach(h=>{
      const y = h.date.slice(0,4);
      let delta = 0;
      if(rec.section === "loan"){ delta = h.type==="received" ? h.amount : (h.type==="repaid" ? -h.amount : 0); }
      else if(rec.section === "advance"){ delta = h.type==="received" ? h.amount : (h.type==="paid" ? -h.amount : 0); }
      map[y] = (map[y]||0) + delta;
    });
  });
  return Object.keys(map).sort().map(y=>({name:y, value:Math.round(map[y])}));
}

// ---- Loans & Advances ----
function toggleLaNew(section){ state.laNewOpen[section] = !state.laNewOpen[section]; state.laFormError[section]=""; render(); }
function updateLaNewField(section, field, v){ state.laNewDraft[section][field] = v; }
function createLaRecord(section){
  const d = state.laNewDraft[section];
  const name = (d.name||"").trim();
  const amt2 = parseFloat(d.amt2) || 0;
  const amt3 = parseFloat(d.amt3) || 0;
  if(!name){ state.laFormError[section] = "Enter a name."; render(); return; }
  if(amt2<=0 && amt3<=0){ state.laFormError[section] = "Enter an amount in at least one box."; render(); return; }
  const history = [];
  if(amt2>0) history.push({ id: genId(), type: section==="loan" ? "received" : "paid", amount: amt2, date: d.date2 || todayStr() });
  if(amt3>0) history.push({ id: genId(), type: section==="loan" ? "repaid" : "received", amount: amt3, date: d.date3 || todayStr() });
  const rec = { id: genId(), section, name, history };
  state.laRecords = [rec, ...state.laRecords];
  saveLaRecords(state.laRecords);
  state.laNewDraft[section] = { name:"", amt2:"", date2: todayStr(), amt3:"", date3: todayStr() };
  state.laNewOpen[section] = false;
  state.laFormError[section] = "";
  render();
}
function updateLaEntryDraftField(recordId, field, v){
  if(!state.laEntryDraft[recordId]) state.laEntryDraft[recordId] = { amt2:"", date2: todayStr(), amt3:"", date3: todayStr() };
  state.laEntryDraft[recordId][field] = v;
}
function addLaTransaction(recordId){
  const rec = state.laRecords.find(r=>r.id===recordId);
  if(!rec) return;
  const draft = state.laEntryDraft[recordId] || {};
  const amt2 = parseFloat(draft.amt2) || 0;
  const amt3 = parseFloat(draft.amt3) || 0;
  if(amt2<=0 && amt3<=0) return;
  if(amt2>0) rec.history.unshift({ id: genId(), type: rec.section==="loan" ? "received" : "paid", amount: amt2, date: draft.date2 || todayStr() });
  if(amt3>0) rec.history.unshift({ id: genId(), type: rec.section==="loan" ? "repaid" : "received", amount: amt3, date: draft.date3 || todayStr() });
  state.laEntryDraft[recordId] = { amt2:"", date2: todayStr(), amt3:"", date3: todayStr() };
  saveLaRecords(state.laRecords);
  render();
}
function deleteLaRecord(id){
  state.laRecords = state.laRecords.filter(r=>r.id!==id);
  saveLaRecords(state.laRecords);
  render();
}
function deleteLaEntry(recordId, entryId){
  const rec = state.laRecords.find(r=>r.id===recordId);
  if(!rec) return;
  rec.history = rec.history.filter(h=>h.id!==entryId);
  saveLaRecords(state.laRecords);
  render();
}
function startEditLaEntry(recordId, entryId){
  const rec = state.laRecords.find(r=>r.id===recordId);
  const entry = rec && rec.history.find(h=>h.id===entryId);
  if(!entry) return;
  state.laEditingEntry = { recordId, entryId };
  state.laEditDraft = { amount: String(entry.amount), date: entry.date };
  render();
}
function cancelEditLaEntry(){ state.laEditingEntry = null; render(); }
function saveEditLaEntry(){
  const info = state.laEditingEntry;
  if(!info) return;
  const rec = state.laRecords.find(r=>r.id===info.recordId);
  const entry = rec && rec.history.find(h=>h.id===info.entryId);
  if(!entry) return;
  const amt = parseFloat(state.laEditDraft.amount);
  if(!amt || amt<=0) return;
  entry.amount = amt;
  entry.date = state.laEditDraft.date || entry.date;
  state.laEditingEntry = null;
  saveLaRecords(state.laRecords);
  render();
}

function getDayEntries(){ return state.entries.filter(en=>en.date===state.selectedDate).sort((a,b)=> a.id<b.id?1:-1); }
function getMonthEntries(){
  const {y,m} = state.monthCursor;
  const prefix = y + "-" + String(m+1).padStart(2,"0");
  return state.entries.filter(en=>en.date.startsWith(prefix));
}
function getYearEntries(){ return state.entries.filter(en=>en.date.startsWith(String(state.yearCursor))); }
function byCategory(list){
  const map = {}; CATEGORIES.forEach(c=>map[c.key]=0);
  list.forEach(en=>{ map[en.category]=(map[en.category]||0)+en.amount; });
  return CATEGORIES.map(c=>({name:c.key, emoji:c.emoji, value:map[c.key], color:c.color})).filter(d=>d.value>0);
}
function byMonthOfYear(list){
  const totals = Array(12).fill(0);
  list.forEach(en=>{ const idx = parseInt(en.date.slice(5,7),10)-1; totals[idx]+=en.amount; });
  return totals.map((v,i)=>({name:MONTH_SHORT[i], value:Math.round(v)}));
}
function applyFilter(){ state.filterApplied = true; render(); }
function getFilteredEntries(){
  const q = (state.filterNote||"").trim().toLowerCase();
  return state.entries.filter(en=>{
    if(state.filterCategory !== "All" && en.category !== state.filterCategory) return false;
    if(en.date < state.filterFrom || en.date > state.filterTo) return false;
    if(q && !(en.note||"").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> a.date < b.date ? 1 : (a.date>b.date?-1:(a.id<b.id?1:-1)));
}

function checkMidnightRollover(){
  const nowToday = todayStr();
  if(nowToday !== state.knownToday){
    const wasOnToday = state.selectedDate === state.knownToday;
    state.knownToday = nowToday;
    if(wasOnToday){ state.selectedDate = nowToday; }
    if(state.view === "day") render();
  }
}
setInterval(checkMidnightRollover, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkMidnightRollover(); });

function renderEntryRows(list){
  if(list.length===0) return '<div class="empty">No expenses recorded here yet.</div>';
  return list.map(en => {
    const c = catInfo(en.category);
    return `
    <div class="entryRow">
      <span class="entryIcon" style="background:${c.color}22;">${c.emoji}</span>
      <div class="entryMid">
        <div class="entryCat">${esc(en.category)}</div>
        ${en.note ? `<div class="entryNote">${esc(en.note)}</div>` : ""}
      </div>
      <span class="entryAmount">${fmt(en.amount)}</span>
      <button class="deleteBtn" onclick="deleteEntry('${en.id}')" aria-label="Delete entry">&times;</button>
    </div>`;
  }).join("");
}

function renderBarChart(data, defaultColor, totalOverride){
  if(data.length===0) return '<div class="empty">Nothing to show yet.</div>';
  const max = Math.max(1, ...data.map(d=>d.value));
  const total = (totalOverride!=null && totalOverride>0) ? totalOverride : (data.reduce((s,d)=>s+d.value,0) || 1);
  return data.map(d => `
    <div class="bar-item">
      ${d.emoji ? `<span class="bar-icon">${d.emoji}</span>` : ""}
      <span class="bar-label">${esc(d.name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(d.value/max*100).toFixed(1)}%;background:${d.color||defaultColor}"></span></span>
      <span class="bar-value">${fmt(d.value)} (${((d.value/total)*100).toFixed(1)}%)</span>
    </div>`).join("");
}

function renderAddForm(){
  return `
    <div class="card">
      <div class="amountHint">ENTER AMOUNT</div>
      <div class="amountRow">
        <span class="rupee">\u20B9</span>
        <input type="number" inputmode="decimal" placeholder="0" id="amountInput" step="0.01" min="0" value="${esc(state.amount)}" oninput="updateAmount(this.value)">
      </div>
      <div class="catGrid">
        ${CATEGORIES.map(c => `
          <button type="button" class="catBtn ${state.category===c.key?'active':''}" onclick="selectCategory('${c.key}')">
            <span class="emoji" style="background:${c.color}22;">${c.emoji}</span>
            <span class="lbl">${c.key}</span>
          </button>`).join("")}
      </div>
      <div class="noteRow">
        <input type="text" placeholder="Add a note (optional)" id="noteInput" value="${esc(state.note)}" oninput="updateNote(this.value)">
      </div>
      ${state.formError ? `<div class="formError">${esc(state.formError)}</div>` : ""}
      <button class="addBtn" onclick="addEntry()">Add expense</button>
    </div>
  `;
}

function laRecordTotals(rec){
  let a=0, b=0;
  rec.history.forEach(h=>{
    if(rec.section === "loan"){
      if(h.type==="received") a+=h.amount; else if(h.type==="repaid") b+=h.amount;
    } else {
      if(h.type==="paid") a+=h.amount; else if(h.type==="received") b+=h.amount;
    }
  });
  return {a,b};
}

function renderLaHistory(rec){
  if(rec.history.length===0) return '<div class="empty">No entries yet.</div>';
  const sorted = [...rec.history].sort((x,y)=> x.date<y.date?1:(x.date>y.date?-1:0));
  return sorted.map(h=>{
    const isEditing = state.laEditingEntry && state.laEditingEntry.recordId===rec.id && state.laEditingEntry.entryId===h.id;
    const label = rec.section === "loan" ? (h.type==="received" ? "Received" : "Repaid") : (h.type==="paid" ? "Paid" : "Received back");
    const dateLabel = new Date(h.date+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
    if(isEditing){
      return `
      <div class="laHistoryRow laEditingRow">
        <input type="number" inputmode="decimal" step="0.01" min="0" value="${esc(state.laEditDraft.amount)}" oninput="state.laEditDraft.amount=this.value" style="width:90px;">
        <input type="date" value="${state.laEditDraft.date}" onchange="state.laEditDraft.date=this.value" style="width:132px;">
        <button class="laMiniBtn" onclick="saveEditLaEntry()">Save</button>
        <button class="laMiniBtn laMiniBtnGhost" onclick="cancelEditLaEntry()">Cancel</button>
      </div>`;
    }
    return `
      <div class="laHistoryRow">
        <span class="laHistoryText">${label} ${fmt(h.amount)} on ${dateLabel}</span>
        <button class="iconBtn" onclick="startEditLaEntry('${rec.id}','${h.id}')" aria-label="Edit entry">&#9998;</button>
        <button class="deleteBtn" onclick="deleteLaEntry('${rec.id}','${h.id}')" aria-label="Delete entry">&times;</button>
      </div>`;
  }).join("");
}

function renderLaRecordCard(rec){
  const {a,b} = laRecordTotals(rec);
  const settled = a>0 && a===b;
  const draft = state.laEntryDraft[rec.id] || { amt2:"", date2: todayStr(), amt3:"", date3: todayStr() };
  const box2Label = rec.section==="loan" ? "Amount received" : "Amount paid (advance)";
  const box3Label = rec.section==="loan" ? "Amount repaid" : "Amount received back";
  return `
    <div class="card laCard">
      <div class="laCardHead">
        <span class="laName">${esc(rec.name)}</span>
        <button class="deleteBtn" onclick="deleteLaRecord('${rec.id}')" aria-label="Delete record">&times;</button>
      </div>
      ${settled ? '<div class="settledBadge">Amount settled</div>' : ""}
      <div class="laAddRow">
        <div class="laAddCol">
          <div class="amountHint">${box2Label.toUpperCase()}</div>
          <input type="number" inputmode="decimal" placeholder="0" step="0.01" min="0" value="${esc(draft.amt2)}" oninput="updateLaEntryDraftField('${rec.id}','amt2',this.value)">
          <input type="date" value="${draft.date2}" onchange="updateLaEntryDraftField('${rec.id}','date2',this.value)">
        </div>
        <div class="laAddCol">
          <div class="amountHint">${box3Label.toUpperCase()}</div>
          <input type="number" inputmode="decimal" placeholder="0" step="0.01" min="0" value="${esc(draft.amt3)}" oninput="updateLaEntryDraftField('${rec.id}','amt3',this.value)">
          <input type="date" value="${draft.date3}" onchange="updateLaEntryDraftField('${rec.id}','date3',this.value)">
        </div>
      </div>
      <button class="addBtn" style="margin-top:10px;" onclick="addLaTransaction('${rec.id}')">Add</button>
      <div class="laHistory">${renderLaHistory(rec)}</div>
    </div>
  `;
}

function renderLaSection(section){
  const title = section === "loan" ? "Loan" : "Advance";
  const records = state.laRecords.filter(r=>r.section===section);
  const isOpen = state.laNewOpen[section];
  const draft = state.laNewDraft[section];
  const box2Label = section==="loan" ? "Amount received (loan)" : "Amount paid (advance)";
  const box3Label = section==="loan" ? "Amount repaid" : "Amount received back";
  return `
    <div class="section">
      <div class="sectionTitle laSectionHead">
        <span>${title}</span>
        <button class="navBtn" onclick="toggleLaNew('${section}')">${isOpen ? "Cancel" : "+ Add"}</button>
      </div>
      ${isOpen ? `
      <div class="card" style="margin-bottom:12px;">
        <div class="amountHint">NAME</div>
        <input type="text" placeholder="Enter name" value="${esc(draft.name)}" oninput="updateLaNewField('${section}','name',this.value)">
        <div class="laAddRow" style="margin-top:12px;">
          <div class="laAddCol">
            <div class="amountHint">${box2Label.toUpperCase()}</div>
            <input type="number" inputmode="decimal" placeholder="0" step="0.01" min="0" value="${esc(draft.amt2)}" oninput="updateLaNewField('${section}','amt2',this.value)">
            <input type="date" value="${draft.date2}" onchange="updateLaNewField('${section}','date2',this.value)">
          </div>
          <div class="laAddCol">
            <div class="amountHint">${box3Label.toUpperCase()}</div>
            <input type="number" inputmode="decimal" placeholder="0" step="0.01" min="0" value="${esc(draft.amt3)}" oninput="updateLaNewField('${section}','amt3',this.value)">
            <input type="date" value="${draft.date3}" onchange="updateLaNewField('${section}','date3',this.value)">
          </div>
        </div>
        ${state.laFormError[section] ? `<div class="formError">${esc(state.laFormError[section])}</div>` : ""}
        <button class="addBtn" onclick="createLaRecord('${section}')">Save</button>
      </div>
      ` : ""}
      ${records.length===0 ? '<div class="card"><div class="empty">No records yet.</div></div>' : records.map(renderLaRecordCard).join("")}
    </div>
  `;
}

function render(){
  const app = document.getElementById("app");
  const dayEntries = getDayEntries();
  const dayTotal = dayEntries.reduce((s,en)=>s+en.amount,0);
  const dayCat = byCategory(dayEntries);

  const monthEntries = getMonthEntries();
  const monthTotal = monthEntries.reduce((s,en)=>s+en.amount,0);
  const monthCat = byCategory(monthEntries);

  const yearEntries = getYearEntries();
  const yearTotal = yearEntries.reduce((s,en)=>s+en.amount,0);
  const yearMonthly = byMonthOfYear(yearEntries);
  const yearCat = byCategory(yearEntries);

  const isToday = state.selectedDate === state.knownToday;
  const dayDateLabel = new Date(state.selectedDate+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

  let content = "";

  if(state.view === "day"){
    content = `
      <div class="section">
        <div class="dateNav">
          <button class="navBtn" onclick="shiftDay(-1)">&#8249; Prev</button>
          <div class="navCenter">
            <input type="date" class="jumpDate" value="${state.selectedDate}" onchange="jumpToDate(this.value)" style="border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);text-decoration:none;">
          </div>
          <button class="navBtn" onclick="shiftDay(1)">Next &#8250;</button>
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">Add expense</div>
        ${renderAddForm()}
      </div>
      <div class="totalBand" style="margin-top:18px;">
        <div class="totalLabel"><span>${isToday ? "Today \u2014 " : ""}${dayDateLabel}</span></div>
        <div class="totalNumber">${fmt(dayTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">Entries</div>
        <div class="card">${renderEntryRows(dayEntries)}</div>
      </div>
      ${dayCat.length ? `
      <div class="section">
        <div class="sectionTitle">Breakdown</div>
        <div class="card">${renderBarChart(dayCat, undefined, dayTotal)}</div>
      </div>` : ""}
    `;
  } else if(state.view === "inflow"){
    const inflowD = state.inflowDate;
    const openingBalance = getOpeningBalance(inflowD);
    const inflowEarningsRaw = state.earnings[inflowD] || "";
    const inflowExpenseEntries = state.entries.filter(en=>en.date===inflowD);
    const inflowExpenseTotal = inflowExpenseEntries.reduce((s,en)=>s+en.amount,0);
    const inflowTotalForDate = getEventsTotal(d=>d===inflowD);
    const closingBalance = openingBalance + inflowTotalForDate - inflowExpenseTotal;
    const inflowIsToday = inflowD === todayStr();
    const inflowDateLabel = new Date(inflowD+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

    const dailyInflowData = getDailyInflowForMonth(state.inflowMonthCursor.y, state.inflowMonthCursor.m);
    const dailyInflowTotal = dailyInflowData.reduce((s,d)=>s+d.value,0);
    const monthlyInflowData = getMonthlyInflowForYear(state.inflowYearCursorForMonthly);
    const monthlyInflowTotal = monthlyInflowData.reduce((s,d)=>s+d.value,0);
    const yearlyInflowData = getYearlyInflowTotals();
    const yearlyInflowTotal = yearlyInflowData.reduce((s,d)=>s+d.value,0);

    content = `
      <div class="section">
        <div class="pageTitle">Earnings</div>
      </div>
      <div class="section">
        <div class="dateNav">
          <button class="navBtn" onclick="shiftInflowDay(-1)">&#8249; Prev</button>
          <div class="navCenter">
            <input type="date" class="jumpDate" value="${inflowD}" onchange="jumpInflowDate(this.value)" style="border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);text-decoration:none;">
          </div>
          <button class="navBtn" onclick="shiftInflowDay(1)">Next &#8250;</button>
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">Opening Balance ${inflowIsToday ? "" : "\u2014 " + esc(inflowDateLabel)}</div>
        <div class="totalBand">
          <div class="totalNumber">${fmt(openingBalance)}</div>
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">${inflowIsToday ? "Today's" : esc(inflowDateLabel) + "\u2019s"} Earnings</div>
        <div class="card">
          <div class="amountHint">ENTER EARNINGS</div>
          <div class="amountRow">
            <span class="rupee">\u20B9</span>
            <input type="number" inputmode="decimal" placeholder="0" id="earningsInput" step="0.01" min="0" value="${esc(inflowEarningsRaw)}" oninput="updateEarnings(this.value)" onchange="render()">
          </div>
          ${(inflowD in state.earnings && state.earnings[inflowD] !== "") ? `
          <button type="button" class="removeEarningsBtn" onclick="removeEarnings('${inflowD}')">Remove earnings for this date</button>
          ` : ""}
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">Closing Balance</div>
        <div class="totalBand">
          <div class="totalNumber">${fmt(closingBalance)}</div>
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">Daily Inflows</div>
        <div class="dateNav" style="margin-bottom:8px;">
          <button class="navBtn" onclick="shiftInflowMonthCursor(-1)">&#8249;</button>
          <div class="navCenter"><span class="navCenterLabel">${monthLabel(state.inflowMonthCursor.y, state.inflowMonthCursor.m)}</span></div>
          <button class="navBtn" onclick="shiftInflowMonthCursor(1)">&#8250;</button>
        </div>
        <div class="card">${renderBarChart(dailyInflowData, BLUE, dailyInflowTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">Monthly Inflows</div>
        <div class="dateNav" style="margin-bottom:8px;">
          <button class="navBtn" onclick="shiftInflowYearCursor(-1)">&#8249;</button>
          <div class="navCenter"><span class="navCenterLabel">${state.inflowYearCursorForMonthly}</span></div>
          <button class="navBtn" onclick="shiftInflowYearCursor(1)">&#8250;</button>
        </div>
        <div class="card">${renderBarChart(monthlyInflowData, BLUE, monthlyInflowTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">Yearly Inflows</div>
        <div class="card">${renderBarChart(yearlyInflowData, BLUE, yearlyInflowTotal)}</div>
      </div>
    `;
  } else if(state.view === "month"){
    content = `
      <div class="totalBand" style="margin-top:14px;">
        <div class="totalLabel">
          <button class="navBtn" style="background:rgba(255,255,255,.18);border-color:transparent;color:#fff;" onclick="shiftMonth(-1)">&#8249;</button>
          <span>${monthLabel(state.monthCursor.y, state.monthCursor.m)}</span>
          <button class="navBtn" style="background:rgba(255,255,255,.18);border-color:transparent;color:#fff;" onclick="shiftMonth(1)">&#8250;</button>
        </div>
        <div class="totalNumber">${fmt(monthTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">By category</div>
        <div class="card">${renderBarChart(monthCat, undefined, monthTotal)}</div>
      </div>
    `;
  } else if(state.view === "year"){
    content = `
      <div class="totalBand" style="margin-top:14px;">
        <div class="totalLabel">
          <button class="navBtn" style="background:rgba(255,255,255,.18);border-color:transparent;color:#fff;" onclick="shiftYear(-1)">&#8249;</button>
          <span>${state.yearCursor}</span>
          <button class="navBtn" style="background:rgba(255,255,255,.18);border-color:transparent;color:#fff;" onclick="shiftYear(1)">&#8250;</button>
        </div>
        <div class="totalNumber">${fmt(yearTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">By month</div>
        <div class="card">${renderBarChart(yearMonthly, "#7C3DEA", yearTotal)}</div>
      </div>
      <div class="section">
        <div class="sectionTitle">By category</div>
        <div class="card">${renderBarChart(yearCat, undefined, yearTotal)}</div>
      </div>
    `;
  } else if(state.view === "loans"){
    content = `
      <div class="section">
        <div class="pageTitle">Loans &amp; Advances</div>
      </div>
      ${renderLaSection('loan')}
      ${renderLaSection('advance')}
    `;
  } else if(state.view === "filter"){
    const results = state.filterApplied ? getFilteredEntries() : [];
    const total = results.reduce((s,en)=>s+en.amount,0);
    content = `
      <div class="section">
        <div class="sectionTitle">Filter expenses</div>
        <div class="card">
          <div class="filterRow">
            <div>
              <div class="filterLbl">Category</div>
              <select id="filterCatSelect" onchange="state.filterCategory=this.value">
                <option value="All" ${state.filterCategory==="All"?"selected":""}>All categories</option>
                ${CATEGORIES.map(c=>`<option value="${c.key}" ${state.filterCategory===c.key?"selected":""}>${c.emoji} ${c.key}</option>`).join("")}
              </select>
            </div>
            <div>
              <div class="filterLbl">Note contains</div>
              <input type="text" placeholder="e.g. lunch, cab, recharge" value="${esc(state.filterNote)}" onchange="state.filterNote=this.value">
            </div>
            <div class="filterRange">
              <div>
                <div class="filterLbl">From</div>
                <input type="date" value="${state.filterFrom}" onchange="state.filterFrom=this.value">
              </div>
              <div>
                <div class="filterLbl">To</div>
                <input type="date" value="${state.filterTo}" onchange="state.filterTo=this.value">
              </div>
            </div>
            <button class="applyBtn" onclick="applyFilter()">Show total</button>
          </div>
          ${state.filterApplied ? `
            <div class="resultBand">
              <div class="resultLabel">${state.filterCategory==="All" ? "All categories" : state.filterCategory}${state.filterNote ? " \u00b7 note: \u201c"+esc(state.filterNote)+"\u201d" : ""} \u00b7 ${state.filterFrom} to ${state.filterTo}</div>
              <div class="resultNumber">${fmt(total)}</div>
            </div>
          ` : ""}
        </div>
      </div>
      ${state.filterApplied ? `
      <div class="section">
        <div class="sectionTitle">Matching entries</div>
        <div class="card">${renderEntryRows(results)}</div>
      </div>` : ""}
    `;
  }

  app.innerHTML = `
    <div class="topbar">
      <img src="icon-192.png" alt="Notish logo">
      <div class="brandBlock">
        <span class="name">Notish</span>
        ${state.view==="day" ? '<span class="tagline">simply clever</span>' : ""}
      </div>
    </div>
    ${state.saveError ? '<div class="errorBanner">Could not save. Your browser storage may be full or blocked.</div>' : ""}
    <div id="installBanner" class="installBanner">
      <span>Install Notish on your home screen.</span>
      <button onclick="triggerInstall()">Install</button>
    </div>
    ${content}
    <div class="tabbar">
      <button class="tabbarItem ${state.view==='day'?'active':''}" onclick="setView('day')"><span class="ic">\ud83d\udcdd</span>Day</button>
      <button class="tabbarItem ${state.view==='inflow'?'active':''}" onclick="setView('inflow')"><span class="ic">\ud83d\udcb0</span>Inflow</button>
      <button class="tabbarItem ${state.view==='month'?'active':''}" onclick="setView('month')"><span class="ic">\ud83d\udcc6</span>Month</button>
      <button class="tabbarItem ${state.view==='year'?'active':''}" onclick="setView('year')"><span class="ic">\ud83d\udcca</span>Year</button>
      <button class="tabbarItem ${state.view==='filter'?'active':''}" onclick="setView('filter')"><span class="ic">\ud83d\udd0d</span>Filter</button>
      <button class="tabbarItem ${state.view==='loans'?'active':''}" onclick="setView('loans')"><span class="ic">\ud83e\udd1d</span>Loans</button>
    </div>
  `;
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById("installBanner");
  if(banner) banner.style.display = "flex";
});
function triggerInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; render(); });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

render();
</script>
</body>
</html>
